name: EAS Update (Send Update to Phones)

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Update channel (preview or production)'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - production
      message:
        description: 'Update message describing changes'
        required: true
        default: 'Fixed popover and navigation'

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify EXPO_TOKEN Secret
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "::error::EXPO_TOKEN is missing! Go to Repo Settings -> Secrets and variables -> Actions -> Add secret 'EXPO_TOKEN' with your token from https://expo.dev/settings/access-tokens"
            exit 1
          fi
          echo "✅ EXPO_TOKEN is configured."

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Publish OTA Update to Phones
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas update --channel ${{ github.event.inputs.channel }} --message "${{ github.event.inputs.message }}" --non-interactive
