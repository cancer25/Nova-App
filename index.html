<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>NOVA - Minimalist Task & Productivity Planner</title>
    <meta name="description" content="A quiet space to think, plan, and get things done with smart natural-language capture and an intelligent AI productivity assistant." />
    <meta property="og:title" content="NOVA - Minimalist Task & Productivity Planner" />
    <meta property="og:description" content="A quiet space to think, plan, and get things done with smart natural-language capture and an intelligent AI productivity assistant." />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/png" href="/assets/images/favicon.png" />
    <script>
      // Suppress benign iframe WebSocket HMR reconnection rejections in cloud environment
      window.addEventListener('unhandledrejection', function(event) {
        var msg = (event && event.reason && (event.reason.message || event.reason.toString())) || '';
        if (typeof msg === 'string' && (msg.indexOf('WebSocket') !== -1 || msg.indexOf('websocket') !== -1)) {
          event.preventDefault();
          if (event.stopImmediatePropagation) event.stopImmediatePropagation();
        }
      });
    </script>
  </head>
  <body class="bg-[#0E0E0E] text-[#F5F5F5] font-['Plus_Jakarta_Sans',sans-serif] antialiased selection:bg-[#6B9677]/30 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
